version: "3.9"

services:

  app:
    build: .
    container_name: ratmir_app
    expose:
      - "8001"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ratmer
    volumes:
      - ./uploads:/app/uploads
      - ./obxod:/app/obxod

  db:
    image: mysql:8.0
    container_name: ratmir_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ratmer
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ratmir_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

  nginx:
    image: nginx:latest
    container_name: ratmir_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  mysql_data:
    name: ratmir_mysql_data