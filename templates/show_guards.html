<!DOCTYPE html>
<html lang="en">

<head>

  {% extends "try.html" %}
  {% block page_css %}
  <style>
    /* ===== ROOT COLORS ===== */
    :root {
      --primary: #1e293b;
      --secondary: #ffffff;
      --accent: #2563eb;
      --bg: #f4f6f8;
      --btn-color: #2563eb;
      --btn-hover: #1d4ed8;
    }

    /* ===== GLOBAL STYLES ===== */
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background-color: var(--bg);
      color: #111;
    }

    h2,
    h3,
    h4 {
      color: #1e293b;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }

    /* ===== FORM CONTAINER ===== */
    .form-container {
      background-color: var(--secondary);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      box-sizing: border-box;
    }

    /* ===== FORM GRID ===== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      /* عمودين على الكمبيوتر */
      gap: 16px 20px;
    }

    .form-grid input,
    .form-grid select,
    #pasword {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      box-sizing: border-box;
    }

    /* ===== BUTTONS ===== */
    button,
    input[type="submit"],
    #generateBtn,
    #bill {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      color: white;
      background-color:  #1e293b;
      transition: background 0.3s;
    }

    
    
  

    /* بعض الأزرار الخاصة مثل "Список прав пользователей" أو "Регистрация присутствия" */
    button.secondary {
      background-color: #0b6a00;
    }

    button.secondary:hover {
      background-color: #084c00;
    }

    /* ===== TAB CONTENT ===== */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .form-container {
        width: 95%;
        padding: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        /* عمود واحد على الهواتف */
      }

      button,
      input[type="submit"],
      #generateBtn,
      #bill,
      #guards {
        width: 100%;
        /* ممتد عرض الشاشة */
        margin: 8px 0;
      }

      #pasword {
        width: 100%;
      }
    }

    /* ===== SPECIAL ELEMENTS ===== */
    #guards {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }

    #myImage {
      width: 200px;
      max-width: 80%;
      border-radius: 6px;
      margin-top: 15px;
    }

    /* الجدول داخل الحرس أو المشاريع */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    table th,
    table td {
      padding: 8px 12px;
      border: 1px solid #ccc;
      text-align: left;
    }

    table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    table tr:hover {
      background-color: #eef;
    }

    @media (max-width: 768px) {
      table {
        display: block;
        overflow-x: auto;
      }

      table th,
      table td {
        font-size: 12px;
        padding: 6px 8px;
      }
    }
  </style>
  {% endblock %}

</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const dropdown = document.getElementById("guards");

  dropdown.addEventListener("change", function () {
    if (this.value !== "0" && this.value !== "") {
      searchProduct();
    }
  });
});
</script>
<!-- داله الجافاسكربت التي بمساعدتها اضهار معلومات الحرس من قاعده البيانات و وضع البيانات 
 في الخانات المطلوبه  -->
<script>
  let totalResults = 0;
  function searchProduct() {
    let Ename = document.getElementById("guards").value;
    

    let url = `/get-guards-by-name/?Ename=${encodeURIComponent(Ename)}`;

    let request = new XMLHttpRequest();
    request.open("GET", url);
    request.responseType = "json";
    request.send();

    request.onload = function () {
      if (request.status >= 200 && request.status < 300) {
        let result = request.response;

        if (!result || Object.keys(result).length === 0) {
          alert("لم يتم العثور على المنتج.");
        } else {
          // تعبئة الخانات الثابتة
          document.getElementById("id2").value = result.id || "";
          document.getElementById("id2_up").value = result.id || "";
          document.getElementById("name2").value = result.name || "";
          document.getElementById("name2_up").value = result.name || "";
          document.getElementById("num_T2").value = result.num_T || "";
          document.getElementById("num_T2_up").value = result.num_T || "";
          document.getElementById("data_prth2").value = result.data_prth || "";
          document.getElementById("data_prth2_up").value = result.data_prth || "";
          document.getElementById("address2").value = result.address || "";
          document.getElementById("address2_up").value = result.address || "";
          document.getElementById("Salary2").value = result.Salary || "";
          document.getElementById("Salary2_up").value = result.Salary || "";
          document.getElementById("Job2").value = result.Job || "";
          document.getElementById("Job2_up").value = result.Job || "";
          document.getElementById("nots2").value = result.nots || "";
          document.getElementById("nots2_up").value = result.nots || "";
          document.getElementById("image_path_up").value = result.image_path || "";
          document.getElementById("is_active_up").value = result.is_active || "";

          // التحكم في السويتش (checkbox)
          const switchEl = document.getElementById("mySwitch");
          const statusEl = document.getElementById("status");
          // تغيير النص حسب القيمة
          if (result.is_active == 1) {
            switchEl.checked = true;
            document.getElementById("status").innerText = "активный ✅";
            document.getElementById("status0").innerText = "активный ✅";

          } else {
            switchEl.checked = false;
            document.getElementById("status").innerText = "неактивный ❌";
            document.getElementById("status0").innerText = "неактивный ❌";

          }
          const img = document.getElementById("myImage");
          img.src = result.image_path; // هنا نربط المتغير بالـ src
          totalResults = result.id || "";
          // اسناد رقم الايدي للحارس الى totalResults
          document.getElementById("employee_id").value = totalResults;
          // اضهار زر الذي من خلاله يمكن جلب معلومات المشاريع التابعين للحارس
           
          document.getElementById("activeFilter").style.display = "block";
          fetchProducts();
        

        }
      } else {
        alert("خطأ في جلب البيانات");
      }
    };

  }

</script>

<script>
let currentProjects = []; // نخزن البيانات هنا ليعاد استخدامها في الفلترة

document.addEventListener("DOMContentLoaded", function () {

    // عند تغيير الفلتر
    document.getElementById("activeFilter")
        .addEventListener("change", function () {
            renderTable();
        });

});


// =============================
// جلب المشاريع
// =============================
function fetchProducts() {

    const params = new URLSearchParams();
    const fields = ["project_id", "employee_id", "nots0"];

    for (let field of fields) {
        let value = document.getElementById(field).value;
        if (value) params.append(field, value);
    }

    fetch(`/get_guards0?${params.toString()}`)
        .then(res => res.json())
        .then(data => {

            currentProjects = data; // نخزن البيانات
            buildHeaders();
            renderTable();

        });
}


// =============================
// بناء رؤوس الجدول
// =============================
function buildHeaders() {

    const headerRow = document.getElementById("table-headers");
    headerRow.innerHTML = "";

    const displayFields = [
        { key: "project_name", label: "проекта" },
        { key: ["start_date", "end_date"], label: "Период работы" },
        { key: "nots", label: "Комментарии" },
        { key: "emp", label: "Закреплённый сотрудник" },
        { key: "shifts_this_month", label: "Смены в текущем месяце" },
        { key: "total_salary", label: "Оплата за смены" }
    ];

    for (let field of displayFields) {
        headerRow.innerHTML += `<th>${field.label}</th>`;
    }

    headerRow.innerHTML += `<th>историю платежей</th><th>Оплата</th>`;
}


// =============================
// رسم الجدول مع الفلترة
// =============================
function renderTable() {

    const table = document.getElementById("product-table");
    const resultCount = document.getElementById("result-count");
    const showOnlyActive = document.getElementById("activeFilter").checked;

    table.innerHTML = "";

    let counter = 0;

    const displayFields = [
        { key: "project_name" },
        { key: ["start_date", "end_date"] },
        { key: "nots" },
        { key: "emp" },
        { key: "shifts_this_month" },
        { key: "total_salary" }
    ];

    for (let row of currentProjects) {

        // فلترة
        if (showOnlyActive && row.is_active != 1) continue;
        if (!showOnlyActive && row.is_active != 0 && row.is_active != 1) continue;

        counter++;

        let textColor = row.is_active == 1 ? "green" : "red";
        let tr = `<tr style="color:${textColor};">`;

        for (let field of displayFields) {

            let cellValue = "";

            if (Array.isArray(field.key)) {
                cellValue = "С " + field.key
                    .map(k => row[k] ?? "")
                    .join(" ДО ");
            } else {
                cellValue = row[field.key] ?? "";
            }

            tr += `<td>${cellValue}</td>`;
        }

        tr += `
        <td>
            <a href="/show_salary_history_page?employee_id_input=${row.employee_id}&project_id_input=${row.project_id}">
                <button>История</button>
            </a>
        </td>
        <td>
            <a href="/Payroll?employee_id_input=${row.employee_id}&project_id_input=${row.project_id}">
                <button>Оплата</button>
            </a>
        </td>
        </tr>`;

        table.innerHTML += tr;
    }

    resultCount.textContent = `проекты: ${counter}`;
}
</script>

<script>

  const checkbox = document.getElementById("mySwitch");
  const hiddenInput = document.getElementById("is_active_up");
  const statusText = document.getElementById("status");

  checkbox.addEventListener("change", function () {
    if (checkbox.checked) {
      hiddenInput.value = 1;                     // القيمة 1 عند التفعيل
      statusText.textContent = "активный ✅";
    } else {
      hiddenInput.value = 0;                     // القيمة 0 عند الإيقاف
      statusText.textContent = "не активный ❌";
    }
  });

</script>
<script>
  document.getElementById("updateForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    let data = {
      id: document.getElementById("id2_up").value,
      name: document.getElementById("name2_up").value,
      num_T: document.getElementById("num_T2_up").value,
      data_prth: document.getElementById("data_prth2_up").value,
      address: document.getElementById("address2_up").value,
      Salary: document.getElementById("Salary2_up").value,
      Job: document.getElementById("Job2_up").value,
      nots: document.getElementById("nots2_up").value,
      image_path: document.getElementById("image_path_up").value,
      is_active: document.getElementById("is_active_up").value   // ✅ الحقل الجديد
    };

    let response = await fetch(`/update_guard`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    let result = await response.json();
    document.getElementById("status").textContent = result.message || result.error;
  });
  ////////////اضهار و اخفاء  قسم تعديل البيانات ////////////

  function show_hade_edt_info() {
    document.getElementById("genral_conter").style.display = "none";
    document.getElementById("updateForm").style.display = "block";
  }

</script>
