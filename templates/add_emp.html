<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Employee</title>
 {% extends "try.html" %}
  {% block page_css %}
<style>
/* ===== Reset & Safety ===== */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f5f9;
}

/* ===== Page Wrapper ===== */
.add-employee-page {
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* ===== Form Container ===== */
.add-employee-page .form-container {
  max-width: 650px;
  margin: auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.06);
}

/* ===== Title ===== */
.add-employee-page h2 {
  text-align: center;
  margin-bottom: 24px;
  color: #1e293b;
  font-size: 22px;
}

/* ===== Labels ===== */
.add-employee-page label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: #475569;
}

/* ===== Inputs ===== */
.add-employee-page input {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 16px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  font-size: 14px;
}

/* ===== File Input ===== */
.add-employee-page input[type="file"] {
  padding: 8px;
  background: #f8fafc;
}

/* ===== Submit Button ===== */
.add-employee-page input[type="submit"] {
  background: #0f172a;
  color: white;
  border: none;
  font-size: 15px;
  cursor: pointer;
  padding: 12px;
  border-radius: 10px;
}

.add-employee-page input[type="submit"]:hover {
  background: #020617;
}

/* ===== Desktop Enhancements ===== */
@media (min-width: 768px) {
  .add-employee-page .form-container {
    padding: 32px;
  }
}
</style>
{% endblock %}

</head>

<body>
    {% block content %}

<div class="add-employee-page">
  <div class="form-container">

    <h2>Информация о сотрудниках</h2>

    <form id="empForm" onsubmit="submitForm(event, 'empForm', '/add-emp')">

      <label>полное имя</label>
      <input type="text" name="name" id="name" required>

      <label>номер телефона</label>
      <input type="text" name="num_T" id="num_T" required>

      <label>дата рождения</label>
      <input type="text" name="data_prth" id="data_prth" required>

      <label>Адрес</label>
      <input type="text" name="address" id="address" required>

      <label>Зарплата</label>
      <input type="text" name="Salary" id="Salary" required>

      <label>должность</label>
      <input type="text" name="Job" id="Job" required>

      <label>Примечание</label>
      <input type="text" name="nots" id="nots" required>

      <label>📷 Фотография сотрудника</label>
      <input type="file" name="image" accept="image/*"  required>

      <input type="submit" value="Определите">

    </form>

  </div>
</div>

<script>
function submitForm(event, formId, url) {
  event.preventDefault();

  const formData = new FormData(document.getElementById(formId));

  fetch(url, { method: "POST", body: formData })
    .then(() => {
      alert("Данные сотрудника успешно отправлены.");
      clearFields([
        "name",
        "num_T",
        "data_prth",
        "address",
        "Salary",
        "Job",
        "nots"
      ]);
    })
    .catch(error => {
      console.error("Error:", error);
      alert("Во время передачи произошла ошибка");
    });
}
</script>
<script>

  let role = sessionStorage.getItem("role");
                if (role === "admin") {
                   
                } else if(role === "supadmin") {
                  document.getElementById("category").style.display = "none";
                  //alert("🚫 У вас нет прав для выполнения этого действия.(Добавить проект)");
                }else if(role === "emp") {
                    window.location.href = "/log_in";
                }else if (!role) {  // الشرط الذي أضفته أنت
                    window.location.href = "/log_in";
                }

</script>
<script>
  function clearFields(ids) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
  }
</script>
{% endblock %}

</body>
</html>
