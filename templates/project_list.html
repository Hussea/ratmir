<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список проектов</title>
    {% extends "try.html" %}
  {% block page_css %}
    <style>
    /* ====== Variables (same style as previous pages) ====== */
:root {
  --primary: #0f172a;
  --secondary: #1e293b;
  --accent: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --bg: #f1f5f9;
  --card: #ffffff;
}

/* ====== Page Base ====== */
body {
  background: var(--bg);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  color: #111;
}

/* ====== Page Title ====== */
h2 {
  margin: 30px 0 20px;
  font-size: 26px;
  font-weight: 600;
  color: var(--primary);
}

/* ====== Project List ====== */
#categoryList {
  max-width: 1100px;
  margin: 0 auto 40px;
  padding: 0 16px;
  list-style: none;
}

/* ====== Project Card ====== */
#categoryList li {
  background: var(--card);
  border-radius: 14px;
  padding: 18px 22px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.05);
  border-left: 6px solid var(--success);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#categoryList li:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.08);
}

/* ====== Project Name ====== */
#categoryList li span {
  font-size: 17px;
  font-weight: 500;
  color: var(--secondary);
  word-break: break-word;
}

/* ====== Buttons Container ====== */
#categoryList li div {
  display: flex;
  gap: 10px;
}

/* ====== Buttons ====== */
#categoryList button {
  border: none;
  padding: 9px 16px;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
  color: #fff;
  white-space: nowrap;
}

#categoryList button:hover {
  transform: scale(1.04);
}

/* Info button */
#categoryList button:first-child {
  background: var(--accent);
}

/* QR button */
#categoryList button:last-child {
  background: var(--secondary);
}

/* ====== Responsive (Tablet & Mobile) ====== */
@media (max-width: 768px) {

  h2 {
    font-size: 22px;
  }

  #categoryList li {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }

  #categoryList li div {
    width: 100%;
    justify-content: center;
  }

  #categoryList button {
    width: 100%;
    font-size: 15px;
  }
}

/* ====== Small Phones ====== */
@media (max-width: 480px) {

  #categoryList li {
    padding: 16px;
  }

  #categoryList li span {
    font-size: 16px;
    text-align: center;
    width: 100%;
  }

  #categoryList li div {
    flex-direction: column;
  }
}
    </style>
    {% endblock %}
</head>
<body>
 <!--bar show start -->
<!--<script src="/static/js/header.js" defer></script> -->
{% block content %}


<!--bar show end -->


<center>
  <h2>Список проектов</h2>
</center>
<ul id="categoryList">
    <!-- سيتم عرض العناصر هنا -->
</ul>

<script>
async function fetchCategories() {
    try {
        const response = await fetch(`/get-categories`);
        const data = await response.json();

        const list = document.getElementById('categoryList');
        list.innerHTML = "";

        if (Array.isArray(data) && data.length > 0) {

            data.forEach(project => {

                const li = document.createElement('li');

                const hasShiftToday = project.shift_count_today > 0;
                
                // 🔹 تغيير اللون حسب وجود شفت اليوم
                li.style.backgroundColor = hasShiftToday 
                    ? "#ffffff"      // أخضر عنده شفت اليوم
                    : "#576574";     // أحمر ما عنده شفت

                const active_not = project.is_active === 1;
                li.style.borderLeftColor = active_not 
                    ? "#10ac84"      // أخضر عنده شفت اليوم
                    : "#ee5253";     // أحمر ما عنده شفت
                // النص
                const span = document.createElement('span');
                span.textContent = project.title;

                // النص
                const span1 = document.createElement('span1');
                span1.textContent = project.shift_count_today + " ох в об";

                 // النص
                const span2 = document.createElement('span1');
                span2.textContent =  " lost time is 30 mint";

                // زر المعلومات
                const button1 = document.createElement('button');
                button1.textContent = "Информация";
                button1.onclick = () => {
                    const url = `/show_project?title=${encodeURIComponent(project.title)}`;
                    window.location.href = url;
                };

                // زر الشفت
                const button2 = document.createElement('button');
                button2.id = "qrBtn";
                button2.textContent = "Сгенерировать QR-код";
                button2.style.backgroundColor = "#0056b3";
                button2.onclick = () => {
                    const url = `/work_shift?title=${encodeURIComponent(project.title)}`;
                    window.location.href = url;
                };

                const rightSide = document.createElement('div');
                rightSide.appendChild(button1);
                rightSide.appendChild(button2);

                li.appendChild(span);
                li.appendChild(span1);
                li.appendChild(span2);
                li.appendChild(rightSide);
                list.appendChild(li);
            });

        } else {
            list.innerHTML = "<li>Данные не найдены.</li>";
        }

    } catch (error) {
        console.error("Ошибка при получении данных:", error);
    }
}

fetchCategories();
</script>

<!-- JAVASCRIPT -->
  <script>
    const menuToggle = document.getElementById("menuToggle");
    const navList = document.getElementById("navList");
    const navLinks = document.querySelectorAll(".navbar li a");

    menuToggle.addEventListener("click", () => {
      navList.classList.toggle("active");
    });

    // Change active link when clicked
    navLinks.forEach(link => {
      link.addEventListener("click", () => {
        navLinks.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
      });
    });
  </script>
 
</body>
