<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Project</title>
  {% extends "try.html" %}
  {% block page_css %}
<style>
/* ===== Reset & Safety ===== */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f5f9;
}

/* ===== Page Wrapper ===== */
.add-project-page {
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* ===== Form Container ===== */
.add-project-page .form-container {
  max-width: 700px;
  margin: auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.06);
}

/* ===== Title ===== */
.add-project-page h2 {
  text-align: center;
  margin-bottom: 24px;
  color: #1e293b;
  font-size: 22px;
}

/* ===== Labels ===== */
.add-project-page label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: #475569;
}

/* ===== Inputs ===== */
.add-project-page input {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 16px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  font-size: 14px;
}

/* ===== Submit Button ===== */
.add-project-page input[type="submit"] {
  background: #0f172a;
  color: white;
  border: none;
  font-size: 15px;
  cursor: pointer;
  padding: 12px;
  border-radius: 10px;
}

.add-project-page input[type="submit"]:hover {
  background: #020617;
}
.time-group {
  display: flex;
  align-items: center;
  gap: 5px;
}

.colon {
  font-size: 20px;
  font-weight: bold;
}

/* ===== Desktop Enhancements ===== */
@media (min-width: 768px) {
  .add-project-page .form-container {
    padding: 32px;
  }
}
</style>
{% endblock %}

</head>

<body>
    {% block content %}

<div class="add-project-page">
  <div class="form-container">

    <h2>Информация о проекте</h2>

    <form id="categoryForm" onsubmit="submitForm(event, 'categoryForm', '/add-category')">

      <label>Название проекта</label>
      <input type="text" name="title" id="title" required>

      <label>Адрес</label>
      <input type="text" name="address" id="address" required>

      <label>Координаты</label>
      <input type="text" name="Coordinates" id="Coordinates" required>

      <label>Требуются охранники</label>
      <input type="number" name="q_person" id="q_person" required>

      <label>Система работы</label>
      <input type="number" name="ses_work" id="ses_work" required>
       <label>время начала смены</label>
      <div class="time-group">
        <label>час</label><span class="colon">:</span>
      <input type="number" name="hour" min="0" max="23" id="hour" required>
      
      <label>минута</label><span class="colon">:</span>
      <input type="number" name="minute" min="0" max="59" id="minute" required>
      </div>

      <label>Доход от проекта</label>
      <input type="number" name="sum_of_proj" id="sum_of_proj" required>

      <label>менеджер проекта</label>
      <input type="text" name="pers_of_proj" id="pers_of_proj" required>

      <label>номер телефона</label>
      <input type="text" name="n_phone" id="n_phone" required>

      <label>Зарплата охранника</label>
      <input type="number" name="sel_emp" id="sel_emp" required>

      <label>Примечание</label>
      <input type="text" name="nots" id="nots" required>

      <input type="submit" value="Представить">

    </form>

  </div>
</div>

<script>
function submitForm(event, formId, url) {
  event.preventDefault();
  const formData = new FormData(document.getElementById(formId));
  fetch(url, { method: "POST", body: formData })
    .then(() => {
      alert("Проект данных успешно добавлен.");
      clearFields([
        "title",
        "address",
        "Coordinates",
        "q_person",
        "ses_work",
        "hour",
        "minute",
        "sum_of_proj",
        "pers_of_proj",
        "n_phone",
        "sel_emp",
        "nots"
      ]);
    })
    .catch(error => {
      console.error("Error:", error);
      alert("Во время передачи произошла ошибка");
    });
}
</script>
<script>

  let role = sessionStorage.getItem("role");
                if (role === "admin") {
                   
                } else if(role === "supadmin") {
                  document.getElementById("category").style.display = "none";
                  //alert("🚫 У вас нет прав для выполнения этого действия.(Добавить проект)");
                }else if(role === "emp") {
                    window.location.href = "/log_in";
                }else if (!role) {  // الشرط الذي أضفته أنت
                    window.location.href = "/log_in";
                }

</script>
<script>
  function clearFields(ids) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
  }
</script>
{% endblock %}

</body>
</html>
