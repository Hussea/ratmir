<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список прав пользователей</title>
     {% extends "try.html" %}
  {% block page_css %}
    <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }
    }
        
        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            margin: 10px 30px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

         

        button {
            background-color: #0600be;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-left: 8px;
        }
 
    </style>
    {% endblock %}

</head>
<body>
    {% block content %}
<center>
  <h2>Список прав пользователей</h2>
</center>
<ul id="categoryList">
    <!-- سيتم عرض العناصر هنا -->
</ul>

<script>
  async function fetchCategories() {
    try {
        const response = await fetch(`/get_admin`);
        const data = await response.json();

        const list = document.getElementById('categoryList');
        list.innerHTML = ""; // تفريغ القائمة قبل عرض النتائج الجديدة

       if (data.username && data.password && data.project && data.role && Array.isArray(data.username)) {
      list.innerHTML = ""; // تنظيف القائمة أولاً

      data.idu.forEach((idu, index) => {
        const username = data.username[index];
        const password = data.password[index];
        const project = data.project[index];
        const role = data.role[index];

        const li = document.createElement('li');
        
        // إنشاء الزر
        const copyButton = document.createElement('button');
        copyButton.textContent = "Копировать";
         
        
        const span = document.createElement('span');
        span.textContent = username;

        const span1 = document.createElement('span');
        span1.textContent = password;
        // تبديل قيمه الرول التي تاتي من ثاعده البيانات الى المستخدك
        const roleNames = {
          admin: "Директор",
          supadmin: "Зам. директора",
          emp: "Бухгалтер",
          formin: "начальник смена"
          };
        const span0 = document.createElement('span');
        span0.textContent = project;
        const span2 = document.createElement('span');
        span2.textContent = roleNames[role] || "Без роли";
        // نهايه


        const button1 = document.createElement('button');
button1.textContent = "Удалить"; 
button1.style.backgroundColor = "red";
button1.style.color = "white";

button1.onclick = async () => {
  if (!confirm("Вы уверены, что хотите удалить этого пользователя?")) return;

  try {
    const response = await fetch(`/delet_admin?idu=${idu}`, {
  method: "GET"
   });


    const data = await response.json();
    alert(data.message);

    // حذف العنصر من الصفحة بعد نجاح العملية
    button1.closest("li").remove();

  } catch (error) {
    console.error("Произошла ошибка при удалении:", error);
    alert("❌Не удалось подключиться к серверу.");
  }
};


        const rightSide = document.createElement('div');
        rightSide.appendChild(button1);
        rightSide.appendChild(copyButton);
 

        //  الزر النسخ
        copyButton.onclick = () => {
            const textToCopy1 = span.textContent;
            const textToCopy2 = span1.textContent;
            

          const textToCopy = `Имя пользователя:- ${textToCopy1}\nПароль:- ${textToCopy2}`;
          
         navigator.clipboard.writeText(textToCopy)
            .then(() => {
               // 🔹 تغيير لون الخلفية حسب الحالة
                li.style.backgroundColor ="#7bed9f"; 
                setTimeout(() => {
                li.style.backgroundColor = ""; // يرجع اللون للوضع الافتراضي بعد ثانية واحدة
                }, 300); // 1000 ملي ثانية = 1 ثانية

            })
            .catch(err => {
              console.error("Ошибка копирования:", err);
            });
        };

        li.appendChild(span);
        li.appendChild(span1);
        li.appendChild(span2);
        li.appendChild(span0);
        li.appendChild(rightSide);
        list.appendChild(li);
      });
    } else {
      list.innerHTML = "<li>لم يتم العثور على بيانات.</li>";
    }
  } catch (error) {
    console.error("خطأ أثناء جلب البيانات:", error);
  }
}

fetchCategories();

</script>
<!-- JAVASCRIPT -->
  <script>
    const menuToggle = document.getElementById("menuToggle");
    const navList = document.getElementById("navList");
    const navLinks = document.querySelectorAll(".navbar li a");

    menuToggle.addEventListener("click", () => {
      navList.classList.toggle("active");
    });

    // Change active link when clicked
    navLinks.forEach(link => {
      link.addEventListener("click", () => {
        navLinks.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
      });
    });
  </script>
  {% endblock %}

</body>
</html>
