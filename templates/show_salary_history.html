<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>историю платежей</title>
  {% extends "try.html" %}
  {% block page_css %}
  <style>
 /* ===== Theme Variables (same as other pages) ===== */
/* ===== RESET مهم جداً للموبايل ===== */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden; /* 🔥 يمنع التشويه */
  font-family: "Poppins", Arial, sans-serif;
  background-color: #f4f6f9;
}

/* ===== الحاوية العامة ===== */
center {
  width: 100%;
  padding: 10px;
}

/* ===== العناوين ===== */
h2 {
  font-size: 24px;
  margin: 15px 0;
  text-align: center;
  color: #2d3436;
}

/* ===== النص العلوي ===== */
#info_line {
  width: 100%;
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  padding: 10px;
  background: #ffffff;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* ===== المدخلات والأزرار ===== */
input[type="month"],
button {
  width: 100%;
  max-width: 300px;
  padding: 10px;
  margin: 6px auto;
  display: block;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background-color: #0984e3;
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: #0652dd;
}

/* ===== الحالة ===== */
#status {
  font-size: 14px;
  margin: 10px 0;
}

/* ================= TABLE DESKTOP ================= */
table {
  width: 95%;
  margin: 20px auto;
  border-collapse: collapse;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

th {
  background-color: #dfe6e9;
  padding: 12px;
  font-size: 14px;
}

td {
  padding: 10px;
  font-size: 13px;
  text-align: center;
  word-break: break-word;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

  /* 🔥 إلغاء أي تمدد أو تشويه */
  table,
  thead,
  tbody,
  tr,
  th,
  td {
    display: block;
    width: 100%;
  }

  thead {
    display: none;
  }

  table {
    background: transparent;
    box-shadow: none;
  }

  tr {
    background: white;
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }

  td {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 8px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    text-align: right;
  }

  td:last-child {
    border-bottom: none;
  }

  td::before {
    content: attr(data-label);
    font-weight: bold;
    color: #636e72;
    margin-left: 10px;
    white-space: nowrap;
  }

  /* ===== تصغير النصوص الطويلة ===== */
  td {
    max-width: 100%;
    overflow-wrap: break-word;
  }
}

/* ===== أجهزة صغيرة جداً ===== */
@media (max-width: 480px) {
  h2 {
    font-size: 20px;
  }

  td {
    font-size: 13px;
  }
}

</style>
{% endblock %}
<body>
 {% block content %}
<center>
<h2>историю платежей</h2>
<p id="status">В информации обнаружена ошибка.</p>
<p id="info_line">
  <span><strong> ФИО:</strong> <span id="show_employee_name"></span></span> |
  <br>
  <span><strong> В Обект:</strong> <span id="show_projact_name"></span></span> |
  <span><strong> Количество выплат:</strong> <span id="show_shift"></span></span> |
  <span><strong> сума :</strong> <span id="show_sum"></span></span> 
</p>

<table id="data-table">
  <thead>
    <tr>
      <th>тип зарплата</th>
      <th>за месяц</th>
      <th>сума</th>
      <th>бухгалтер</th>
      <th>ответсвенный</th>
      <th>начальник смена</th>
      <th>примечания</th>
      <th>статус получения</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</center>


<script>
  // استخراج البارامترات من رابط الصفحةffff
  const params = new URLSearchParams(window.location.search);
  

  function loadData() {
   const empId = params.get("employee_id_input");
   const projId = params.get("project_id_input");
   
    
    if (!empId || !projId ) {
      document.getElementById('status').textContent = '⚠️ الرجاء إدخال معرف الموظف والمشروع.';
      return;
    }

    let apiUrl = `/show_salary_history?employee_id_input=${empId}&project_id_input=${projId}`;

    
    document.getElementById('status').textContent = '🔄 جارٍ تحميل البيانات...';
    document.getElementById('data-table').style.display = 'none';
    document.querySelector('#data-table tbody').innerHTML = '';

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) {
          document.getElementById('status').textContent = '❌ Нет соответствующих данных.';
          return;
        }

        const tbody = document.querySelector('#data-table tbody');
        let total = 0;

        data.forEach(item => {
          const row = document.createElement('tr');
          const selEmp = Number(item.sum || 0);
          total += selEmp;

          row.innerHTML = `
            <td data-label="тип зарплата">${item.pay_method || "-"}</td>
            <td data-label="за месяц">${item.pay_for || "-"}</td>
            <td data-label="сума">${item.sum || "-"}</td>
            <td data-label="бухгалтер">${item.data_entry_clerk_id || "-"}</td>
            <td data-label="ответсвенный">${item.process_supervisor_id || "-"}</td>
            <td data-label="начальник смена">${item.responsible_emp_id || "-"}</td>
            <td data-label="примечания">${item.nots || "-"}</td>
            <td data-label="статус получения">${item.done_or_not || "-"}</td>
          `;
          tbody.appendChild(row);
          document.getElementById('show_employee_name').textContent = `${item.employee_name}`;
          document.getElementById('show_projact_name').textContent = `${item.projuct_title}`;
        });

        document.getElementById('data-table').style.display = 'table';
        document.getElementById('status').style.display = 'none';
        document.getElementById('show_shift').textContent = `${data.length}`;
        document.getElementById('show_sum').textContent = `${total}`;

      })
      .catch(err => {
        document.getElementById('status').textContent = '❌ خطأ في تحميل البيانات.';
        console.error(err);
      });
      
  }
      window.onload = loadData;

</script>

{% endblock %}

</body>
</html>
