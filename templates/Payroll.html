<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Просмотр данных смены</title>
    {% extends "try.html" %}
  {% block page_css %}
  <style>
  /* ===== Global Theme (same as other pages) ===== */
:root {
  --primary: #0f172a;
  --secondary: #1e293b;
  --accent: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --bg: #f1f5f9;
  --card: #ffffff;
  --border: #e5e7eb;
}

/* ===== Base ===== */
body {
  background: var(--bg);
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  color: #111;
}

/* ===== Header / Filters ===== */
#fers_info {
  max-width: 1200px;
  margin: 20px auto;
  padding: 18px 22px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 22px rgba(0,0,0,0.06);
}

#fers_info h2 {
  margin-top: 0;
  color: var(--primary);
  font-size: 22px;
  font-weight: 600;
}

#fers_info label {
  font-weight: 600;
  margin-right: 10px;
}

#fers_info input[type="month"] {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 14px;
}

#fers_info button {
  margin-left: 10px;
  padding: 9px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

#fers_info button:hover {
  background: #1d4ed8;
}

/* ===== Status ===== */
#status {
  margin: 12px 0;
  padding: 10px 14px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  font-weight: 600;
}

/* ===== Info Line ===== */
#info_line {
  margin-top: 14px;
  padding: 14px 18px;
  background: #f8fafc;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 14px;
  line-height: 1.8;
}

/* ===== Table ===== */
/* ===== جدول عام ===== */
#data-table {
  width: 95%;
  margin: 20px auto;
  border-collapse: collapse;
  background: #fff;
}

#data-table th,
#data-table td {
  padding: 10px;
  border: 1px solid #ccc;
  text-align: center;
}

#data-table th {
  background: #f2f2f2;
  font-weight: bold;
}

/* ===== صورة داخل الجدول ===== */
#data-table img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

  #data-table,
  #data-table thead,
  #data-table tbody,
  #data-table th,
  #data-table td,
  #data-table tr {
    display: block;
    width: 100%;
  }

  #data-table thead {
    display: none; /* إخفاء الهيدر */
  }

  #data-table tr {
    margin-bottom: 15px;
    background: #f9f9f9;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  #data-table td {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: 8px 5px;
    font-size: 14px;
  }

  #data-table td:last-child {
    border-bottom: none;
  }

  /* العناوين */
  #data-table td::before {
    content: attr(data-label);
    font-weight: bold;
    color: #555;
  }

  #data-table img {
    width: 70px;
    height: 70px;
  }
}

/* ===== Payment Form Panel ===== */
#divPiy {
  background: var(--card);
  border-radius: 18px;
  border: 1px solid var(--border);
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
}

#divPiy input,
#divPiy select,
#divPiy textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
}

#divPiy textarea {
  min-height: 120px;
  resize: vertical;
}

#divPiy input[type="submit"] {
  background: var(--success);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  cursor: pointer;
}

#divPiy input[type="submit"]:hover {
  background: #15803d;
}

/* ===== Last Payment Card ===== */
#info_line1 {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 14px;
}

#goToSalaryHistoryBtn {
  margin-top: 10px;
  padding: 8px 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#goToSalaryHistoryBtn:hover {
  background: #1d4ed8;
}

/* ===== Responsive ===== */
@media (max-width: 900px) {

  #fers_info {
    padding: 14px;
  }

  #data-table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }

  #divPiy {
    position: static;
    width: 100%;
    margin: 20px auto;
    height: auto;
  }
}

@media (max-width: 480px) {

  #fers_info h2 {
    font-size: 18px;
  }

  #fers_info button {
    margin-top: 10px;
    width: 100%;
  }

  #info_line {
    font-size: 13px;
  }
}
/* نافذة الصورة */
#imgModal {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.9);
  z-index: 99999;

  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* الصورة */
#imgModal img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  animation: zoomIn 0.3s ease;
}

/* زر الإغلاق */
.close-btn {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 32px;
  color: white;
  cursor: pointer;
  background: rgba(0,0,0,0.6);
  border-radius: 50%;
  width: 45px;
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover {
  background: red;
}

/* حركة */
@keyframes zoomIn {
  from {
    transform: scale(0.85);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

</style>
{% endblock %}

<body>
  {% block content %}
  
<div id="fers_info">
  <h2>Просмотр данных смены</h2>

    <label for="start_day"> введите год и месяц:</label>
    <input type="month" id="start_day" />
  
    
    <button onclick="loadData()">Просмотреть данные</button>
    

<p id="status"> Укажите месяц и год ⚠️</p>
<p id="info_line">
  <span><strong> ФИО:</strong> <span id="show_employee_name"></span></span> |
  <br>
  <span><strong> В Обект:</strong> <span id="show_projact_name"></span></span> |
  <span><strong> ЗП :</strong> <span id="show_employee_sel"></span></span> |
  <span><strong> смена:</strong> <span id="show_shift"></span></span> |
  <span><strong> сума :</strong> <span id="show_sum"></span></span> 
</p>
</div>


<table id="data-table">
  <thead>
    <tr>
      <td>Дата начала</td>
      <td>Время начала</td>
      <td>real_time</td>
      <td>фото</td>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<script>
  // الحصول على التاريخ الحالي
  const today = new Date();
  // تحويله إلى صيغة YYYY-MM
  const month = today.toISOString().slice(0, 7);
  // تعيينه كقيمة افتراضية للمدخل
  document.getElementById("start_day").value = month;
</script>

<script>
  // استخراج البارامترات من رابط الصفحة
  const params = new URLSearchParams(window.location.search);
  

  function loadData() {
    const empId = params.get("employee_id_input");
    const projId = params.get("project_id_input");
    const startDay = document.getElementById('start_day').value;
    document.getElementById("emp_id_send").value = params.get("employee_id_input");
    document.getElementById("proj_id_send").value = params.get("project_id_input");
    if (!empId || !projId || !startDay) {
      document.getElementById('status').textContent = 'Укажите месяц и год ❗';
      return;
    }

    let apiUrl = `/show_work_shift?employee_id_input=${empId}&project_id_input=${projId}`;
    if (startDay) {
      apiUrl += `&start_day=${startDay}-01`;
    }

    
    document.getElementById('status').textContent = 'Загрузка данных 🔄...';
    document.getElementById('data-table').style.display = 'none';
    document.querySelector('#data-table tbody').innerHTML = '';

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) {
          document.getElementById('status').textContent = ' Нет соответствующих данных ❌';
          return;
        }

        const tbody = document.querySelector('#data-table tbody');
        let total = 0;

        data.forEach(item => {
          const row = document.createElement('tr');
          const selEmp = Number(item.projuct_sel_emp || 0);
          total += selEmp;

          row.innerHTML = `
  <td data-label="Дата начала">${item.start_day || "-"}</td>
  <td data-label="Время начала">${item.start_time || "-"}</td>
  <td data-label="Дата окончания">${item.rel_start_date || "-"}</td>
  
  <td data-label="Фото">
    <img src="${item.file_path}"
         alt="нет фото"
         onclick="showImage(this)">
  </td>
`;
          tbody.appendChild(row);
          document.getElementById('show_employee_name').textContent = `${item.employee_name}`;
          document.getElementById('show_projact_name').textContent = `${item.projuct_title}`;
          document.getElementById('show_employee_sel').textContent = `${item.projuct_sel_emp}`;
        });

        document.getElementById('data-table').style.display = 'table';
        document.getElementById('status').style.display = 'none';
        document.getElementById('show_shift').textContent = `${data.length}`;
        document.getElementById('show_sum').textContent = `${total}`;

      })
      .catch(err => {
        document.getElementById('status').textContent = 'Нет соответствующих данных ❌';
        console.error(err);
      });
      
  }
</script>
<!-- نافذة التكبير -->
<div id="imgModal" onclick="closeImage()">
  <img id="modalImg" src="">
</div>
<script>
function showImage(img) {
  const modal = document.getElementById("imgModal");
  const modalImg = document.getElementById("modalImg");

  modal.style.display = "flex";
  modalImg.src = img.src;
}

function closeImage() {
  document.getElementById("imgModal").style.display = "none";
}
closeImage();
</script>
<form id="employee-form" onsubmit="submitForm(event)" style="margin: 2%;">
<div id="form-message"></div>
   
  <input type="number" id="emp_id_send" name="emp_id_send" style="display: none;"/>
  <input type="number" id="proj_id_send" name="proj_id_send" style="display: none;"/>

<div id="divPiy" >
  
  <p id="info_line1">
  <strong>Последний платеж:</strong> 
  <span><strong> тип:</strong> <span id="show_employee_name_salry"></span></span> |
  <span><strong> За:</strong> <span id="show_projact_name_salry"></span></span> |
  <span><strong> сума :</strong> <span id="show_sum_salry"></span></span> 
  <button id="goToSalaryHistoryBtn">Платежи</button>
</p>
<input type="text" id="try" id="emp_ent" name="emp_ent" style="display: none;">
   

  <div class="form-row" style="margin: 2%;"> 
    <label for="sum_pay">сумма платежа:</label>
  <input type="number" id="sum_pay" name="sum_pay"  required/>
  </div>
  
<div class="form-row" style="margin: 2%;"> 
  <label for="pay_month" >За месяц:</label>
  <input type="month" id="pay_month" name="pay_month" required/>

</div>
  <div class="form-row" style="margin: 2%;">
    <label for="mySelect">тип зп:</label>
  <select id="mySelect" required name="mySelect">
    <option value="" disabled selected hidden>Выбирать тип зарплата</option>
    <option value="зарплата">зарплата</option>
    <option value="аванс">аванс</option>
    <option value="други">други</option>
  </select>
  </div>
  
<div class="form-row" style="margin: 2%;">
<label for="pay_month" >notes:</label>
  <textarea id="notes" name="notes" placeholder="Напишите свои заметки или дополнительные детали здесь..." ></textarea>

</div>
 
<center>
  <input type="submit" value="отправлять">
</center>
   
   </form>
</div>
 
<table id="data_table_salry">
  <tbody></tbody>
</table>
<script>
  // استخراج البارامترات من رابط الصفحة
  
 function lost_salry() {
  const empId = params.get("employee_id_input");
  const projId = params.get("project_id_input");
   
  fetch(`/show_salary_history?employee_id_input=${empId}&project_id_input=${projId}`)
    .then(res => res.json())
    .then(data => {
      // ✅ نأخذ فقط السطر الأخير
      const lastItem = data[data.length - 1];
      const tbody = document.querySelector('#data_table_salry tbody');
      const selEmp = Number(lastItem.sum || 0);
      const row = document.createElement('tr');
      tbody.appendChild(row);

      // ✅ تعبئة باقي المعلومات
      document.getElementById('show_employee_name_salry').textContent = `${lastItem.pay_method}`;
      document.getElementById('show_projact_name_salry').textContent = `${lastItem.pay_for}`;
      document.getElementById('show_sum_salry').textContent = `${lastItem.sum}`;
    })
    .catch(err => {
      document.getElementById('status').textContent = 'нет данных.';
      console.error(err);
    });
}

// ✅ تنفيذ الدالة تلقائياً عند تحميل الصفحة
window.onload = function() {
    lost_salry();
    loadData();
};


</script>
 
<script>
 
  document.getElementById("goToSalaryHistoryBtn").addEventListener("click", function() {
      const employeeId = params.get("employee_id_input");
      const projectId = params.get("project_id_input");

      if (!employeeId || !projectId) {
          alert("Employee ID или Project ID отсутствуют!");
          return;
      }

      const url = `/show_salary_history_page?employee_id_input=${employeeId}&project_id_input=${projectId}`;
      window.location.href = url;
  });
</script>



<script>
   

    // إرسال النموذج
    function submitForm(event) {
  event.preventDefault();

  const form = document.getElementById("employee-form");
  const formData = new FormData(form);

  fetch(`/salary_history`, {
    method: "POST",
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    const msg = document.getElementById("form-message");
    msg.textContent = data.message; // 👈 نعرض نفس النص القادم من بايثون

    if (data.status === "success") {
      document.getElementById('employee-form').reset();
      msg.style.color = "green";
    } else {
      msg.style.color = "red";
    }

    console.log("Server response:", data);
  })
  .catch(error => {
    const msg = document.getElementById("form-message");
    msg.style.color = "red";
    msg.textContent = "⚠️ فشل الاتصال بالخادم";
    console.error("Fetch error:", error);
  });
}


  </script>
  



</body>
