events {}

http {

    # تحويل كل HTTP إلى HTTPS
    server {
        listen 80;
        server_name rat-mir.ru www.rat-mir.ru;

        return 301 https://$host$request_uri;
    }

    # خادم HTTPS
    server {
        listen 443 ssl;
        server_name rat-mir.ru www.rat-mir.ru;

        # مسارات الشهادة والمفتاح
        ssl_certificate /etc/letsencrypt/live/rat-mir.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rat-mir.ru/privkey.pem;

        # إعدادات أمان SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location / {
            proxy_pass http://app:8001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}